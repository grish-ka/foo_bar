name: Release Installers

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-installers:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # --- LINUX CONFIG ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: foo_bar             # Cargo output name
            binary_name: foo_bar-linux-amd64   # Renamed for download
            installer_name: foo_bar-linux-amd64.deb  # Final installer name

          # --- WINDOWS CONFIG ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: foo_bar.exe           # Cargo output name
            binary_name: foo_bar-windows-amd64.exe # Renamed for download (Fixed typo)
            installer_name: foo_bar-windows-amd64.msi # Final installer name

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP RUST
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. BUILD BINARY
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- LINUX STEPS ---
      - name: Build DEB Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Build the .deb
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }} --output ${{ matrix.installer_name }}
          
          # 2. Copy the RAW BINARY to root and rename it for upload
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      # --- WINDOWS STEPS ---
      - name: Build MSI Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet tool install --global wix

          # 1. Copy RAW EXE to root and rename it (for the Release upload)
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}
          
          # 2. Prepare WiX 'app' folder
          mkdir -p app
          
          # 3. Copy the exe into app/ for WiX to use
          # FIX: We copy from the 'target' folder, not ./foo_bar.exe
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} app/foo_bar.exe

          # 4. Copy _internal if it exists
          if [ -d "app/_internal" ]; then
            cp -r app/_internal app/_internal
          else
            echo "No _internal folder found, skipping."
          fi

          # 5. Build the MSI
          dotnet build installer/foo_bar.wixproj -c Release -p:Platform=x64

          # 6. Move MSI to root and rename it
          find installer -name "*.msi" -exec mv {} ${{ matrix.installer_name }} \;

      # 4. UPLOAD EVERYTHING
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.installer_name }}
            ${{ matrix.binary_name }}
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}