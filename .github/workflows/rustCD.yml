name: Release Installers

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-installers:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # --- LINUX CONFIG ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: foo_bar             # Cargo output name
            binary_name: foo_bar-linux-amd64   # Renamed for download
            installer_name: foo_bar-linux-amd64.deb  # Final installer name

          # --- WINDOWS CONFIG ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: foo_bar.exe         # Cargo output name
            binary_name: foo_bar-windows-amd64.exe # Renamed for download
            installer_name: foo_bar-windows-amd64.msi # Final installer name

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. SETUP RUST
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 3. BUILD BINARY
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- LINUX STEPS ---
      - name: Build DEB Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          # Use raw version (Linux handles betas fine)
          cargo deb --target ${{ matrix.target }} --output ${{ matrix.installer_name }}
          
          # Copy the RAW BINARY for upload
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      # --- WINDOWS STEPS ---
      - name: Build MSI Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # 1. Prepare 'app' folder structure
          mkdir -p app
          
          # 2. Copy the compiled executable into 'app/' so WiX can find it
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} app/foo_bar.exe
          cp installer/app/* app/
          # 3. Copy the compiled executable to root for raw upload
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}

          # 5. Build MSI with CLEAN VERSION (Prevents crash on beta tags)
          dotnet build installer/foo_bar.wixproj -c Release -p:Platform=x64

          # 6. Find and rename MSI for upload
          find installer -name "*.msi" -exec mv {} ${{ matrix.installer_name }} \;

      # 4. UPLOAD EVERYTHING
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.installer_name }}
            ${{ matrix.binary_name }}
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}