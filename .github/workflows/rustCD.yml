name: Release Installers

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-installers:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # --- LINUX CONFIG ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: foo_bar          # The raw binary name
            binary_name: foo_bar-linux-amd64  # The name of the binary inside the installer
            installer_name: foo_bar-linux-amd64.deb

          # --- WINDOWS CONFIG ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: foo_bar.exe                  # The raw binary name
            binary_name: foo_bar-linux-amd64.exe        # The name of the binary inside the installer
            installer_name: foo_bar-windows-amd64.msi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP RUST
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. BUILD BINARY
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- LINUX STEPS ---
      - name: Build DEB Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Build the .deb
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }} --output ${{ matrix.installer_name }}
          
          # 2. Copy the RAW BINARY to root so we can upload it too
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      # --- WINDOWS STEPS ---
      - name: Build MSI Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet tool install --global wix

          # 1. Copy RAW EXE to root (for the Release upload)
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.binary_name }}
          
          # 2. Prepare WiX 'app' folder
          mkdir -p app
          # Copy the exe into app/ for WiX to use
          cp ./foo_bar.exe app/foo_bar.exe


          # 4. Build the MSI
          dotnet build installer/foo_bar.wixproj -c Release -p:Platform=x64

          # 5. Move MSI to root
          find installer -name "*.msi" -exec mv {} ${{ matrix.installer_name }} \;

      # 4. UPLOAD EVERYTHING
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          # UPLOADS BOTH THE INSTALLER AND THE RAW EXE
          files: |
            ${{ matrix.installer_name }}
            ${{ matrix.binary_name }}
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}