name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: foo_bar
            asset_name: foo_bar-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: foo_bar.exe
            asset_name: foo_bar-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Binary
        run: cargo build --release

      - name: Rename Binary
        shell: bash
        run: |
          cp target/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
          # THE MAGIC LINE:
          # If the tag contains a '-', it marks it as a Pre-release.
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}